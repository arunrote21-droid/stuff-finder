<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>โน้ตเนตร</title>
<meta name="description" content="เปิดโน้ตเพลงตอนเล่นดนตรี จัดคิวเพลงได้ ใช้ได้โดยไม่ต้องมีอินเทอร์เน็ต">
<meta name="theme-color" content="#07100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="โน้ตเนตร">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" data-act="menu" aria-label="เมนู">☰</button>
    <div class="ttl"><b id="tSong">โน้ตเนตร</b><small id="tSet"></small></div>
    <span class="chip" id="tPage" hidden></span>
    <button class="ib" data-act="edit" id="editBtn" aria-label="แก้ไขโน้ต" hidden>✎</button>
    <button class="ib" data-act="zoom" id="zoomBtn" aria-label="ขยายโน้ต" hidden>🔍</button>
  </header>
  <div class="main" id="main">
    <section class="stage" id="stage">
      <div class="inner" id="inner"><img id="pg" alt="" draggable="false"></div>
      <div class="empty" id="empty"></div>
      <button class="nextsong" id="nextSong" data-act="nextsong" hidden></button>
      <div class="dots" id="dots"></div>
    </section>
    <aside class="panel" id="panel"></aside>
  </div>
  <footer class="strip" id="strip">
    <button class="qbtn" data-act="queue" aria-label="คิวทั้งหมด">คิว <b id="qn">0</b></button>
    <div class="qwrap" id="qwrap"></div>
    <button class="qplus" data-act="add" aria-label="เพิ่มเพลง">＋</button>
  </footer>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" multiple hidden>
<script src="fflate.min.js"></script>
<script src="app.js"></script>
</body>
</html>
